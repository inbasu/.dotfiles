# Shell
shell                       /usr/bin/zsh

# Font
font_family                 JetBrainsMono Nerd Font
bold_font                   auto
italic_font                 auto
bold_italic_font            auto
font_size                   12.0

# Window
enable_audio_bell           no
background_opacity          0.75
hide_window_decorations     yes
shell_integration           disabled
window_padding_width        6
window_resize_step_cells    5
window_resize_step_lines    2
confirm_os_window_close     0

# Tabs
tab_bar_min_tabs            1
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          "{index}:{title}"
tab_fade                    0.7


# Utils
detect_urls                 yes
mouse_hide_wait             10.0
term                        xterm-kitty
clipboard_control           write-clipboard write-primary
disable_ligatures           always

# Keybindings
map kitty_mod+enter         no-op
map cmd+enter               no-op

map ctrl+b>c                new_tab
map ctrl+b>q                close_tab
map ctrl+b>1                goto_tab 1
map ctrl+b>2                goto_tab 2
map ctrl+b>3                goto_tab 3
map ctrl+b>4                goto_tab 4
map ctrl+b>5                goto_tab 5
map ctrl+b>6                goto_tab 6
map ctrl+b>7                goto_tab 7
map ctrl+b>8                goto_tab 8
map ctrl+b>9                goto_tab 9

# Colors (darkvoid)
background                    #020202
foreground                    #c0c0c0
cursor                        #bdfe58
selection_background          #303030
selection_foreground          #c0c0c0
url_color                     #1bfd9c
active_tab_background         #1c1c1c
active_tab_foreground         #c0c0c0
inactive_tab_background       #1c1c1c
inactive_tab_foreground       #585858

## Normal colors
color0                        #1c1c1c
color1                        #dea6a0
color2                        #1bfd9c
color3                        #bdfe58
color4                        #7fa1c3
color5                        #b2d8d8
color6                        #66b2b2
color7                        #c0c0c0

## Bright colors
color8                        #404040
color9                        #ffb3ba
color10                       #baffc9
color11                       #ffffba
color12                       #bedc74
color13                       #d6efd8
color14                       #e1e1e1
color15                       #f1f1f1

